{% extends "base.html" %}
{% block title %}Aerospace-X Portal{% endblock %}

{% block head %}
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    /* ---------- MAIN CONTENT ---------- */
    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 60px;
        min-height: calc(100vh - 60px);
        padding: 80px 40px 40px;
        background-color: #fafafa;
        flex-wrap: wrap;
    }

    .option {
        border-radius: 20px;
        width: 340px;
        height: 340px;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.25s ease;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        cursor: pointer;
        background-color: rgba(0, 157, 224, 0.15);
    }
    .option:hover {
        transform: translateY(-4px);
        box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        background-color: rgba(0, 157, 224, 0.28);
    }
    .option a {
        text-decoration: none;
        color: black;
        font-size: 1.4em;
        font-weight: 600;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        border-radius: 20px;
        padding: 20px;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 1100px) {
        .container {
            gap: 40px;
        }
        .option {
            width: 280px;
            height: 280px;
        }
    }

    @media (max-width: 768px) {
        .container {
            flex-direction: column;
            gap: 30px;
            padding: 100px 20px 40px;
        }
        .option {
            width: 90%;
            height: 180px;
        }
        .option a {
            font-size: 1.2em;
        }
    }
</style>
{% endblock %}

{% block body %}
<div class="container">
    <div class="option">
        <a href="{{ url_for('nq.nq_cockpit') }}">
            Non-Quality Data Exchange Cockpit
        </a>
    </div>

    <div class="option">
        <a href="{{ url_for('edc.edc_cockpit') }}">
            EDC Management Cockpit
        </a>
    </div>
</div>
{% endblock %}
